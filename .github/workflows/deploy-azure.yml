name: Deploy to Azure Container Apps
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'openspec/**', 'specs/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr build -r ${{ vars.ACR_NAME }} -g ${{ vars.RESOURCE_GROUP }} \
            -t conjuros-api:${{ github.sha }} -f Dockerfile.api .
          az acr build -r ${{ vars.ACR_NAME }} -g ${{ vars.RESOURCE_GROUP }} \
            -t conjuros-web:${{ github.sha }} -f Dockerfile.web .

      - name: Roll out new revisions
        run: |
          az containerapp update -n ${{ vars.CONTAINER_APP }} -g ${{ vars.RESOURCE_GROUP }} \
            --container-name conjuros-api --image ${{ vars.ACR_NAME }}.azurecr.io/conjuros-api:${{ github.sha }} \
            --revision-suffix gh${{ github.run_id }}-api
          az containerapp update -n ${{ vars.CONTAINER_APP }} -g ${{ vars.RESOURCE_GROUP }} \
            --container-name conjuros-web --image ${{ vars.ACR_NAME }}.azurecr.io/conjuros-web:${{ github.sha }} \
            --revision-suffix gh${{ github.run_id }}-web

      - name: Verify rollout
        env:
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          RUN_ID: ${{ github.run_id }}
        run: |
          revision="${CONTAINER_APP}--gh${RUN_ID}-web"
          attempts="${ROLLOUT_ATTEMPTS:-60}"
          interval="${ROLLOUT_INTERVAL_SECONDS:-10}"

          for attempt in $(seq 1 "$attempts"); do
            # Query one property at a time: `-o tsv` prints array elements on separate lines.
            provisioning="$(az containerapp revision show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --revision "$revision" \
              --query "properties.provisioningState" -o tsv 2>/dev/null || true)"
            health="$(az containerapp revision show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --revision "$revision" \
              --query "properties.healthState" -o tsv 2>/dev/null || true)"
            echo "Attempt ${attempt}/${attempts}: ${revision} provisioning=${provisioning:-pending} health=${health:-pending}"

            if [ "$provisioning" = "Provisioned" ] && [ "$health" = "Healthy" ]; then
              echo "Revision ${revision} is healthy."
              exit 0
            fi

            if [ "$provisioning" = "Failed" ]; then
              echo "::error::Revision ${revision} failed to provision."
              break
            fi

            sleep "$interval"
          done

          az containerapp logs show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --container conjuros-api --revision "$revision" --tail 100 || true
          echo "::error::Revision ${revision} did not become healthy within the rollout timeout."
          exit 1
