services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: conjuros-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conjuros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-conjuros}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: conjuros-cloudbeaver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8978:8978'
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: conjuros-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-conjuros}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conjuros}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: conjuros-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:80'

volumes:
  postgres_data:
  cloudbeaver_workspace:
